# 星火聊天 (spark-chat) 容器编排
# 运行：docker compose up -d --build
# 访问：http://localhost:3000
services:
  spark-chat:
    build:
      context: .
      dockerfile: Dockerfile
    image: spark-chat:latest
    container_name: spark-chat
    # 容器内绑定 0.0.0.0 以便从宿主机访问（应用默认绑 127.0.0.1，靠此变量放开）
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_ENV=production
      # 凭证可选：CodeBuddy API Key / Auth Token 可在应用内「设置」填入，
      # 或用环境变量注入（如 `CODEBUDDY_API_KEY=xxx docker compose up -d`）。
      # 不配置时应用优雅降级，不影响聊天基础功能。
    ports:
      - "3000:3000"
    volumes:
      # SQLite 数据与上传文件持久化（不随容器销毁丢失）
      - spark-data:/app/data
    restart: unless-stopped
    # 用 Node 22 自带 fetch 探测存活端点（slim 镜像无 curl）
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  spark-data:
